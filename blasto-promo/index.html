<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Tektur:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px;
        overflow: hidden; background: #0b1017;
        font-family: 'Orbitron', system-ui, sans-serif;
      }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }

      .star { position: absolute; border-radius: 50%; background: #fff; }
      .star-lg { box-shadow: 0 0 6px rgba(255,255,255,0.5); }

      /* SPLASH — dual-tone A-mark (green→purple, matches the game's splash screen) */
      .splash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 20; }
      .splash svg { display: block; margin: 0 auto; }
      .splash-tag { margin-top: 28px; font-family: 'JetBrains Mono', monospace;
        font-size: 22px; color: rgba(125,211,252,0.7); letter-spacing: 10px; text-transform: uppercase; }

      /* HUD */
      .hud-bar {
        position: absolute; top: 0; left: 0; width: 1080px; height: 56px;
        background: rgba(11,16,23,0.85); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 24px; z-index: 100;
        border-bottom: 1px solid rgba(34,211,238,0.25);
      }
      .hud-left { color: #e6f2ff; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
      .hud-center { color: #22d3ee; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; text-shadow: 0 0 10px rgba(34,211,238,0.5); }
      .hud-right { color: #ef4444; font-size: 20px; letter-spacing: 4px; }

      /* SHIP */
      .ship-wrap { position: absolute; z-index: 50; left: 510px; top: 1680px; }
      .trail { position: absolute; border-radius: 50%; z-index: 49; }

      /* BULLETS */
      .bullet {
        position: absolute; border-radius: 50%; z-index: 40;
        width: 12px; height: 12px;
        background: #22d3ee;
        box-shadow: 0 0 14px #22d3ee, 0 0 28px rgba(34,211,238,0.5);
      }
      .bullet-core { position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); width: 4px; height: 4px;
        border-radius: 50%; background: #fff; }

      /* ASTEROIDS — spin applied to child SVG so it doesn't conflict with GSAP translate on the div */
      .asteroid { position: absolute; z-index: 30; }
      .sp-a > svg { animation: spin-slow 1.8s linear infinite; transform-origin: center; transform-box: fill-box; }
      .sp-b > svg { animation: spin-med 1.3s linear infinite; transform-origin: center; transform-box: fill-box; }
      .sp-c > svg { animation: spin-fast 0.9s linear infinite; transform-origin: center; transform-box: fill-box; }
      .sp-d > svg { animation: spin-slow 2.4s linear infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes spin-slow { to { transform: rotate(360deg); } }
      @keyframes spin-med  { to { transform: rotate(360deg); } }
      @keyframes spin-fast { to { transform: rotate(360deg); } }

      /* EFFECTS */
      .exp-ring { position: absolute; border-radius: 50%; border: 3px solid #fff; z-index: 60; }
      .exp-particle { position: absolute; border-radius: 50%; background: #fff; z-index: 60; width: 4px; height: 4px; }
      .dmg-num {
        position: absolute; font-family: 'JetBrains Mono', monospace; font-weight: 700;
        color: #fff; font-size: 22px; text-shadow: 0 0 8px rgba(0,0,0,0.9), 0 0 14px rgba(34,211,238,0.6);
        z-index: 70;
      }

      /* CALLOUT */
      .announce {
        position: absolute; left: 50%; top: 38%;
        transform: translate(-50%, -50%);
        font-weight: 800; text-align: center; z-index: 110;
        font-family: 'Orbitron', system-ui, sans-serif;
        font-size: 76px; color: #f59e0b;
        text-shadow: 0 0 30px #f59e0b, 0 0 60px #f59e0b;
        letter-spacing: 6px;
      }

      /* FLASH OVERLAYS */
      .flash-overlay { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; z-index: 200; }

      /* OUTRO — start screen wordmark (B L [cyan A] S T O), matches game start screen */
      .outro-el { position: absolute; left: 50%; text-align: center; z-index: 80; }
      .wordmark {
        transform: translate(-50%, -50%); top: 38%;
        display: flex; align-items: center; justify-content: center;
        gap: 0; line-height: 1; white-space: nowrap;
      }
      .wm-letter {
        font-family: 'Tektur', 'Orbitron', system-ui, sans-serif;
        font-weight: 900; font-size: 150px; line-height: 1.35;
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, #e6f8ff 0%, #22d3ee 45%, #0891b2 80%, #155e75 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter:
          drop-shadow(0 0 14px rgba(34,211,238,0.55))
          drop-shadow(0 0 36px rgba(34,211,238,0.25))
          drop-shadow(0 4px 0 rgba(0,0,0,0.55));
        padding: 0 0.025em;
        transform: skewX(-2deg);
      }
      .wm-amark {
        display: inline-flex; align-items: center; justify-content: center;
        margin: 0 0.03em;
        transform: translateY(0.06em) skewX(-2deg);
      }
      .wm-amark svg { height: 142px; width: auto; display: block; }
      .wm-caption {
        transform: translate(-50%, 0); top: 50%;
        font-family: 'JetBrains Mono', monospace; font-weight: 500;
        font-size: 22px; letter-spacing: 7px; text-transform: uppercase;
        color: rgba(125,211,252,0.75);
      }
      .wm-caption .tri    { color: #22d3ee; text-shadow: 0 0 8px rgba(34,211,238,0.6); margin: 0 4px; }
      .wm-caption .tri2   { color: #a5f3fc; opacity: 0.85; }
      .wm-caption .tri3   { color: #0e7490; }
      .wm-caption .sep    { color: rgba(125,211,252,0.4); margin: 0 6px; }
      .wm-caption .ver    { color: #22d3ee; font-weight: 500; text-shadow: 0 0 8px rgba(34,211,238,0.5); }
      .outro-url {
        transform: translate(-50%, 0); top: 56%;
        font-size: 30px; color: #e6f2ff;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 4px;
      }
      .outro-cta {
        transform: translate(-50%, 0); top: 63%;
        font-family: 'Tektur', 'Orbitron', sans-serif;
        font-weight: 900; font-size: 56px; color: #22d3ee;
        text-shadow: 0 0 24px #22d3ee, 0 0 48px #22d3ee;
        letter-spacing: 6px;
      }
      .outro-footer {
        transform: translate(-50%, 0); top: 92%;
        display: flex; gap: 36px; align-items: center;
        font-family: 'JetBrains Mono', monospace; font-size: 18px;
        color: rgba(148,163,184,0.7); letter-spacing: 3px;
      }
      @keyframes cursor-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor-blink { animation: cursor-blink 0.6s step-end infinite; }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const SHIP_CX = 540;   // ship visual center x
      const SHIP_CY = 1710;  // ship visual center y (top:1680 + 30)

      // ═══ SCENE 1: SPLASH (0.0 – 1.6) — dual-tone A-mark grows with glow then exits to flash ═══
      tl.fromTo("#splash-mark", { scale: 0.7, opacity: 0 }, { scale: 1.05, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 0.05);
      tl.to("#splash-mark",     { scale: 1.0, duration: 0.5, ease: "sine.inOut" }, 0.6);
      tl.fromTo(".splash-tag",  { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.5);
      tl.to("#splash",          { opacity: 0, scale: 1.15, duration: 0.25, ease: "power2.in" }, 1.35);
      tl.set("#splash", { opacity: 0 }, 1.6);

      // White flash transition
      tl.fromTo("#flash-intro", { opacity: 0 }, { opacity: 0.85, duration: 0.1, ease: "none" }, 1.5);
      tl.to("#flash-intro", { opacity: 0, duration: 0.3, ease: "power2.out" }, 1.6);

      // ═══ SCENE 2: GAMEPLAY (1.7 – 4.5) ═══

      // HUD entrance
      tl.from("#hud", { y: -60, opacity: 0, duration: 0.3, ease: "power2.out" }, 1.7);

      // Ship entrance
      tl.from("#ship-wrap", { scale: 0, y: 80, opacity: 0, duration: 0.35, ease: "back.out(1.7)" }, 1.7);

      // Engine trail: 5 cycling dots, repeated through gameplay
      const trailIds = ["#trail-1","#trail-2","#trail-3","#trail-4","#trail-5"];
      for (let cycle = 0; cycle < 6; cycle++) {
        const bt = 1.95 + cycle * 0.42;
        for (let i = 0; i < 5; i++) {
          const dx = (i - 2) * 4;
          tl.fromTo(trailIds[i],
            { y: 0, x: dx, opacity: 0.75 },
            { y: 50, x: dx + 6, opacity: 0, duration: 0.4, ease: "power2.out" },
            bt + i * 0.06);
        }
      }

      // === Asteroid falls (each lands at its hit point, then hidden) ===
      function asteroidHit(id, tStart, tHit, transformY) {
        tl.fromTo(id, { y: 0 }, { y: transformY, duration: tHit - tStart, ease: "none" }, tStart);
        tl.set(id, { opacity: 0 }, tHit + 0.04);
      }
      asteroidHit("#ast-1", 1.7,  2.3,  480);
      asteroidHit("#ast-2", 2.4,  2.85, 500);
      asteroidHit("#ast-3", 2.55, 3.15, 550);
      asteroidHit("#ast-4", 3.2,  3.8,  480);
      asteroidHit("#ast-5", 3.3,  4.0,  520);
      asteroidHit("#ast-6", 3.4,  4.2,  560);

      // === Bullets (diagonal from ship to asteroid hit point) ===
      // Each bullet starts at ship center (534, 1704) and travels to (asteroid_center_x, asteroid_hit_y).
      const bulletShots = [
        { id: "#b-1", fire: 2.0,  hit: 2.3,  tx: 423, ty: 400 }, // → ast-1 lime center
        { id: "#b-2", fire: 2.55, hit: 2.85, tx: 203, ty: 420 }, // → ast-2 lime
        { id: "#b-3", fire: 2.85, hit: 3.15, tx: 729, ty: 450 }, // → ast-3 verde
        { id: "#b-4", fire: 3.5,  hit: 3.8,  tx: 309, ty: 380 }, // → ast-4 verde
        { id: "#b-5", fire: 3.7,  hit: 4.0,  tx: 571, ty: 400 }, // → ast-5 azul
        { id: "#b-6", fire: 3.9,  hit: 4.2,  tx: 819, ty: 420 }, // → ast-6 purp
      ];
      for (const b of bulletShots) {
        const dx = b.tx - SHIP_CX;
        const dy = b.ty - SHIP_CY;
        const dur = b.hit - b.fire;
        tl.fromTo(b.id,
          { x: 0,  y: 0,  opacity: 1, scale: 1 },
          { x: dx, y: dy, opacity: 1, scale: 0.6, duration: dur, ease: "none" },
          b.fire);
        tl.set(b.id, { opacity: 0 }, b.hit + 0.01);
      }

      // === Explosion rings (expand + fade) ===
      function expRing(id, t, peak) {
        tl.fromTo(id, { scale: 0, opacity: 0.95 }, { scale: peak || 4, opacity: 0, duration: 0.42, ease: "power2.out" }, t);
      }
      expRing("#er-1", 2.3,  4);
      expRing("#er-2", 2.85, 4);
      expRing("#er-3", 3.15, 4.5);
      expRing("#er-4", 3.8,  4.5);
      expRing("#er-5", 4.0,  5);
      expRing("#er-6", 4.2,  5.5);

      // === Explosion particles (radial spray) ===
      function particle(id, t, dx, dy) {
        tl.fromTo(id,
          { x: 0,  y: 0,  scale: 1.2, opacity: 1 },
          { x: dx, y: dy, scale: 0.2, opacity: 0, duration: 0.5, ease: "power2.out" }, t);
      }
      particle("#xp-1",  2.3,  -50, -40); particle("#xp-2",  2.3,   55, -30);
      particle("#xp-3",  2.85, -45,  35); particle("#xp-4",  2.85,  50, -40);
      particle("#xp-5",  3.15, -55, -45); particle("#xp-6",  3.15,  55,  40);
      particle("#xp-7",  3.8,  -50,  40); particle("#xp-8",  3.8,   55, -35);
      particle("#xp-9",  4.0,  -65, -45); particle("#xp-10", 4.0,   65, -50);
      particle("#xp-11", 4.2,  -80, -60); particle("#xp-12", 4.2,   85,  55);

      // === Damage numbers (float up + fade) ===
      function dmgFloat(id, t, dur) {
        tl.fromTo(id, { y: 0, opacity: 1, scale: 1.3 }, { y: -90, opacity: 0, scale: 1, duration: dur || 0.6, ease: "power2.out" }, t);
      }
      dmgFloat("#d-1", 2.3);
      dmgFloat("#d-2", 2.85);
      dmgFloat("#d-3", 3.15);
      dmgFloat("#d-4", 3.8);
      dmgFloat("#d-5", 4.0);
      dmgFloat("#d-6", 4.2, 0.75);

      // === COMBO callout ===
      tl.fromTo("#combo-txt", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 4.25);
      tl.to("#combo-txt", { opacity: 0, scale: 1.1, duration: 0.25, ease: "power2.in" }, 4.65);
      tl.set("#combo-txt", { opacity: 0 }, 4.9);

      // Orange flash
      tl.fromTo("#flash-combo", { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "none" }, 4.25);
      tl.to("#flash-combo", { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.33);

      // === Score counter (deterministic increments) ===
      const scoreEl = document.getElementById("score");
      const scoreState = { v: 0 };
      function bumpScore(t, target, dur) {
        tl.to(scoreState, { v: target, duration: dur, ease: "none", onUpdate: () => { scoreEl.textContent = Math.floor(scoreState.v); } }, t);
      }
      bumpScore(2.3,  10,  0.05);
      bumpScore(2.85, 20,  0.05);
      bumpScore(3.15, 40,  0.05);
      bumpScore(3.8,  60,  0.05);
      bumpScore(4.0,  95,  0.05);
      bumpScore(4.2,  145, 0.05);
      bumpScore(4.3,  450, 0.35); // combo bonus

      // ═══ SCENE 3: OUTRO (4.8 – 6.0) ═══

      // Fade out ship & HUD before logo lands
      tl.to("#ship-wrap", { opacity: 0, y: 60, duration: 0.3, ease: "power2.in" }, 4.5);
      tl.to("#hud",       { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 4.5);
      tl.set("#ship-wrap", { opacity: 0 }, 4.8);
      tl.set("#hud", { opacity: 0 }, 4.8);

      // Outro entrances — game's start screen layout
      tl.fromTo("#outro-wordmark", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.4)" }, 4.8);
      tl.fromTo("#outro-caption",  { y: 12, opacity: 0 },        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 4.95);
      tl.fromTo("#outro-url",      { y: 20, opacity: 0 },        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 5.05);
      tl.fromTo("#cta-text",       { y: 40, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.25);
      tl.fromTo("#outro-footer",   { opacity: 0 },                { opacity: 0.85, duration: 0.4, ease: "power2.out" }, 5.45);

      // Fade to black
      tl.fromTo("#fade-black", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 5.7);

      // === Starfield parallax (each layer scrolls top→bottom at a different speed) ===
      const TOTAL = 6;
      document.querySelectorAll('.star[data-star-layer="1"]').forEach(s => {
        tl.fromTo(s, { y: 0 }, { y: 360, duration: TOTAL, ease: "none" }, 0);
      });
      document.querySelectorAll('.star[data-star-layer="2"]').forEach(s => {
        tl.fromTo(s, { y: 0 }, { y: 720, duration: TOTAL, ease: "none" }, 0);
      });
      document.querySelectorAll('.star[data-star-layer="3"]').forEach(s => {
        tl.fromTo(s, { y: 0 }, { y: 1440, duration: TOTAL, ease: "none" }, 0);
      });

      // Hold final frame for the last 0.02s
      tl.set({}, {}, 6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
